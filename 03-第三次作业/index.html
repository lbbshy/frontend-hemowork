<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI助教答疑平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #eef4ff 0%, #f5f7fa 50%, #eef4ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
        }
        .container {
            width: 100%;
            max-width: 640px;
        }
        .brand { text-align: center; margin-bottom: 32px; }
        .brand h1 {
            font-size: 1.8rem;
            color: #1e293b;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .brand p { color: #64748b; font-size: .95rem; }

        .ask-box {
            background: #fff;
            border-radius: 16px;
            padding: 10px 10px 10px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 40px rgba(59, 130, 246, .1);
            margin-bottom: 20px;
        }
        .ask-box input {
            flex: 1;
            height: 42px;
            border: none;
            outline: none;
            font-size: .95rem;
            color: #0f172a;
            background: transparent;
        }
        .ask-box input::placeholder { color: #94a3b8; }
        .ask-btn {
            height: 42px;
            padding: 0 24px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            font-size: .95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform .15s, box-shadow .2s;
        }
        .ask-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(59,130,246,.3); }

        .answer-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(59, 130, 246, .08);
            border-left: 4px solid #3b82f6;
        }
        .answer-tag {
            display: inline-block;
            background: #eef2ff;
            color: #4f46e5;
            font-size: .75rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .answer-text {
            color: #334155;
            font-size: .92rem;
            line-height: 1.7;
        }
        .answer-text .dim { color: #94a3b8; }

        .nav-links {
            text-align: center;
            margin-top: 28px;
            font-size: .88rem;
            color: #64748b;
        }
        .nav-links a {
            color: #3b82f6;
            text-decoration: none;
            margin: 0 8px;
        }
        .nav-links a:hover { text-decoration: underline; }

        /* 简易输入校验反馈 */
        .ask-box input.invalid { color: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">
            <h1>AI助教答疑平台</h1>
            <p>智能答疑 · 随时提问</p>
        </div>

        <!-- 提问输入框 -->
        <form id="askForm" class="ask-box" novalidate>
            <input type="text" id="question" placeholder="请输入你的问题..."
                required minlength="2" maxlength="200"
                autocomplete="off">
            <button type="submit" class="ask-btn">提问</button>
        </form>

        <!-- 助教回答区 -->
        <div class="answer-card" id="answerCard">
            <span class="answer-tag">助教回答</span>
            <div class="answer-text" id="answerText">
                这是第 1 个问题，AI 接口将在第 9 周接入。<span class="dim">（当前为模拟回答）</span>
            </div>
        </div>

        <div class="nav-links">
            <a href="login.html">登录</a>·
            <a href="register.html">注册</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('askForm');
        const input = document.getElementById('question');
        const answerText = document.getElementById('answerText');
        let count = 1;

        form.addEventListener('submit', e => {
            e.preventDefault();
            if (!input.checkValidity()) {
                input.classList.add('invalid');
                input.placeholder = '问题至少 2 个字符';
                return;
            }
            input.classList.remove('invalid');
            const q = input.value.trim();
            count++;
            answerText.innerHTML = `已收到你的问题：<strong>${q}</strong><br><span class="dim">这是第 ${count} 个问题，AI 接口将在第 9 周接入。</span>`;
            input.value = '';
        });

        input.addEventListener('input', () => {
            input.classList.remove('invalid');
            input.placeholder = '请输入你的问题...';
        });
    </script>
</body>
</html>
